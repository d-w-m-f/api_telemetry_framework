# Perfis de dataset. O perfil é knob do Experimento, não gera código novo.
#
# A diferença entre `small` (cabe em shared_buffers) e `large` (não cabe) É a
# medida de IOPS do projeto — ver PLAN §3. Rodar só um dos dois responde metade
# da pergunta.
#
# `estoque_por_produto` é folgado de propósito: `write_contended` mede contenção
# de linha, não esgotamento de estoque. Se o estoque acabasse no meio do run, o
# workload mudaria sozinho de "escrita concorrente" para "gerador de 409" — uma
# variável não controlada entrando na janela de medição.

tiny:      # conformidade e desenvolvimento
  categories: 8
  products: 500
  customers: 200
  orders: 1000
  seed: 20260101

small:     # cache quente: expõe diferenças de runtime
  categories: 40
  products: 20000
  customers: 5000
  orders: 50000
  seed: 20260102

large:     # não cabe em shared_buffers: expõe IOPS
  categories: 200
  products: 500000
  customers: 200000
  orders: 2000000
  seed: 20260103

comum:
  epoch: "2026-01-01T00:00:00Z"   # instante fixo; nunca "agora"
  janela_dias: 730
  estoque_por_produto: 1000000
  itens_por_pedido: [1, 5]
  preco_centavos: [199, 49999]
