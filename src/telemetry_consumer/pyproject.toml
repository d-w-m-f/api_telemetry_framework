[project]
name = "telemetry-consumer"
version = "0.1.0"
description = "Single Python consumer: spins sandbox environments, collects telemetry, persists run state"
authors = [
    {name = "d-w-m-f",email = "derick.william.moraes@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "pika (>=1.3,<2.0)",
    "psycopg[binary] (>=3.2,<4.0)",
]


[tool.poetry]
package-mode = false


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
