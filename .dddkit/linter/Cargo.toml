[package]
name = "dddkit"
version = "0.1.0"
edition = "2021"
description = "Deterministic structural linter for DDD-Kit: proves the spec-code graph resolves."
license = "MIT"

[[bin]]
name = "dddkit"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
ignore = "0.4"
glob = "0.3"
regex = "1"

[profile.release]
opt-level = 2
strip = true
